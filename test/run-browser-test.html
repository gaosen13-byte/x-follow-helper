<!doctype html><html><head><meta charset="utf-8"><title>Scanner test</title></head><body><h1>Scanner browser tests</h1><pre id="result">Running…</pre><iframe id="following" src="fixture-following.html"></iframe><iframe id="followers" src="fixture-followers.html"></iframe><script src="../src/scanner.js"></script><script>
(async()=>{const out=document.getElementById('result'),fail=[];function assert(ok,msg){if(!ok)fail.push(msg)}await new Promise(resolve=>{let n=0;for(const f of document.querySelectorAll('iframe'))f.onload=()=>{if(++n===2)resolve()}});const [following,followers]=[...document.querySelectorAll('iframe')].map(f=>f.contentDocument);const a=XFH.collectVisible(following),b=XFH.collectVisible(followers);assert(XFH.getPageMode('/someuser/following')==='following','following mode');assert(XFH.getPageMode('/someuser/followers')==='followers','followers mode');assert(XFH.getPageMode('/someuser/verified_followers')==='followers','verified followers mode');assert(XFH.getPageMode('/someuser/likes')===null,'unknown mode');assert(a.length===30,'following fixture count');assert(b.length===30,'followers fixture count');assert(XFH.filterCandidates(a,'following',[]).length===19,'exact following candidates');assert(XFH.filterCandidates(b,'followers',[]).length===15,'exact follower candidates');assert(XFH.filterCandidates(a,'following',['user1']).length===18,'whitelist exclusion');assert(XFH.toCSV(a).replace(/^\uFEFF/,'').split('\r\n')[0]==='"handle","name","profile_url","follows_you","i_follow"','CSV header');out.textContent=fail.length?'FAIL\n'+fail.join('\n'):'ALL PASS';document.title=fail.length?'FAIL':'ALL PASS'})();
</script></body></html>
